    "/api/v2/auth/apple": {
      "post": {
        "operationId": "appleExchange",
        "summary": "Exchange verified Apple credentials for a QuickReads session",
        "description": "HTTPS, native-only audience com.leftlaneapps.shortstoriesdot. Maximum body 32768 bytes; strict fields and profile object. Server verifies both the submitted RS256 identity JWT and the JWT returned by Apple code redemption (matching subject, native audience and exact nonce), issuer https://appleid.apple.com and expiry, with 60 seconds clock skew. Developer client secret uses ES256. Email is derived only from verified claims. New Apple accounts have null legacy alias and empty string names when absent; returning accounts retain names and stored email. New identities require a usable verified email (422); existing email collisions return 409 apple_account_link_required with no linking or account disclosure. No implicit password method. Success always 200 SessionResponse, same 30-day QuickReads bearer issuer. Exact semantic retries (fixed required credentials, profile names and locale; key order and omitted/null optional fields equivalent) recover the original encrypted response for 300 seconds after completion, without redeeming code or issuing another token. Changed payload returns 409 apple_attempt_conflict. Expired, failed or revoked attempts return 401. During in-flight redemption return 503 apple_exchange_pending with Retry-After: 2; retry the exact payload briefly, then obtain fresh authorization if stuck. Provider timeout/ambiguous response returns 503 apple_restart_required and requires fresh native authorization; never resubmit a redeemed code with another attempt. After a durable verified receipt, an account/session database failure (500) permits exact retry until original challenge expiry; a crash before that receipt cannot recover and requires a new attempt. Successful recovery also ends on logout/revocation/account deletion. Limits: 10/minute/IP/operation plus 60/minute/IP group. All responses private, no-store.",
        "security": [],
        "parameters": [],
        "requestBody": {
