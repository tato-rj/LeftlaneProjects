    "/api/v2/stories": {
      "get": {
        "operationId": "listStories",
        "summary": "List or search compact story summaries",
        "security": [],
        "parameters": [
          {
            "$ref": "#/components/parameters/Page"
          },
          {
            "$ref": "#/components/parameters/PerPage"
          },
          {
            "$ref": "#/components/parameters/IfNoneMatch"
          },
          {
            "name": "q",
            "in": "query",
            "schema": {
              "type": "string",
              "maxLength": 200
            },
            "description": "Trimmed literal substring over title or author; blank means browse all. LOWER + production utf8mb4_unicode_ci collation is case/accent insensitive. No explicit Unicode normalization; not full-text/theme search. %, _ and ! are escaped literal characters."
          },
          {
            "name": "author_id",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 4294967295
            },
            "description": "Filter by author ID; unknown ID is 404."
          },
          {
            "name": "category_id",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 4294967295
            },
            "description": "Filter by the single stored category ID; unknown ID is 404."
          },
          {
            "name": "exclude_id",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 4294967295
            },
            "description": "Exclude an extant story ID, including current story when expanding related results."
          },
          {
            "name": "min_minutes",
            "in": "query",
            "schema": {
              "type": "number",
              "minimum": 0,
              "maximum": 1000000
            },
            "description": "Inclusive lower bound. Omit for no lower bound."
          },
          {
            "name": "max_minutes",
            "in": "query",
            "schema": {
              "type": "number",
              "minimum": 0,
              "maximum": 1000000
            },
            "description": "Inclusive upper bound. Omit for no upper bound; must be >= min_minutes."
          },
          {
            "name": "sort",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "editorial",
                "title",
                "latest",
                "popular"
              ],
              "default": "editorial"
            },
            "description": "Editorial: category sorting_order ascending (null last), then story ID ascending. Title: database title ordering then ID. Latest: created_at descending then ID. Popular: distinct favoriting accounts descending then ID. No relevance ranking. Cannot combine sort with section."
          },
          {
            "name": "section",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "featured",
                "latest",
                "popular",
                "under_10_minutes",
                "classics",
                "suggestions"
              ]
            },
            "description": "Explore expansion criteria. Featured is one deterministic daily UTC pick; latest/popular use corresponding sort. Under 10 includes <=10; classics uses is_classic; suggestions is editorial catalog order. Other filters intersect the section. All sorts use ID ties."
          }
        ],
        "responses": {
          "200": {
            "description": "Successful response.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/StoryPage"
                }
              }
            },
            "headers": {
              "ETag": {
                "description": "Quoted SHA-256 validator of serialized response JSON. Present on successful public GET/HEAD.",
                "schema": {
                  "type": "string"
                }
              },
              "Cache-Control": {
                "description": "Public GET/HEAD: public, max-age=60, must-revalidate. Private/account/auth and all errors: private, no-store.",
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "404": {
            "$ref": "#/components/responses/Error404"
          },
          "405": {
            "$ref": "#/components/responses/Error405"
          },
          "413": {
            "$ref": "#/components/responses/Error413"
          },
          "422": {
            "$ref": "#/components/responses/Error422"
          },
          "429": {
            "$ref": "#/components/responses/Error429"
          },
          "500": {
            "$ref": "#/components/responses/Error500"
          },
          "304": {
            "description": "Representation unchanged. No body.",
            "headers": {
              "ETag": {
                "description": "Quoted SHA-256 validator of serialized response JSON. Present on successful public GET/HEAD.",
                "schema": {
                  "type": "string"
                }
              },
              "Cache-Control": {
                "description": "Public GET/HEAD: public, max-age=60, must-revalidate. Private/account/auth and all errors: private, no-store.",
                "schema": {
                  "type": "string"
                }
              }
            }
          }
        }
      },
