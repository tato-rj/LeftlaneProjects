{
  "openapi": "3.0.3",
  "info": {
    "title": "QuickReads API v2",
    "version": "2.1.0",
    "description": "Implemented parallel API. Existing /quickreads URLs are untouched. All IDs are decimal strings in responses. JSON success uses data; lists add meta and links. Nullable fields are emitted as explicit null. Public catalog ignores account aliases, cookies and bearer credentials; fetch private favorites separately. Mutation bodies are JSON objects; unsupported/non-object bodies fail. Existing operations ignore unknown fields/query parameters; new Apple, account-deletion and activity bodies are strict. Dates use RFC3339 UTC. Production MySQL search uses utf8mb4_unicode_ci; SQLite tests emulate legacy functions but are not a production collation or concurrency test. GET also supports HEAD. Native Sign in with Apple and write-only story-state reporting are implemented behind the documented deployment prerequisites. No reactions, cross-device progress/Library sync, server audio, account linking or historical alias/hash mapping is claimed."
  },
  "servers": [
    {
      "url": "https://leftlaneapps.com",
      "description": "Deployment origin (v2 must be deployed and migrated before use)."
    }
  ],
