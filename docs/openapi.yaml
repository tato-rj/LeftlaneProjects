        "description": "Apple server-to-server notification receiver, not an iOS bearer operation. HTTPS and a verified RS256 Apple JWT authenticate the request; never rely on the public route alone. Maximum body 32768 bytes. Native issuer/audience, iat (30-day maximum age, 60-second future allowance), jti and events fields are checked. Supports consent-revoked/account-deleted (invalidate affected Apple-derived sessions and discard refresh token), email-enabled/email-disabled (update forwarding state without deleting the canonical account). Duplicate jti is acknowledged once; out-of-order provider revocations are checked by authorization time. No account data is returned. Register this URL privately in Apple Developer configuration. API 60 requests/minute/IP bucket applies.",
