      "delete": {
        "operationId": "deleteAccount",
        "summary": "Delete the authenticated QuickReads account",
        "description": "HTTPS, explicit delete_account:true, maximum body 32768 bytes. Requires a valid QuickReads bearer issued within the last 10 minutes; sign in again if older (401). Revokes retained Apple refresh tokens server-to-server before deleting account data; provider failure returns 503 and keeps the account for retry. Deletes canonical user, v2 sessions, favorites, comments, ratings, reset records, matching newsletter subscription and account activity/receipts. Provider identity is removed; a subject hash/event-time security tombstone is retained for at most 90 days to reject pre-deletion proofs. Guest reports remain separate. Does not remotely delete offline files or change device data. Logout remains separate. No automatic account linking is provided.",
        "security": [
          {
            "QuickReadsBearer": []
          }
        ],
        "parameters": [],
