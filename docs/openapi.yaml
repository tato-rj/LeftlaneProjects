    "/api/v2/story-activity": {
      "post": {
        "operationId": "reportStoryActivity",
        "summary": "Report the latest state of one story for the captured reader",
        "description": "Write-only current-state reporting. HTTPS, strict JSON object, maximum 32768 bytes. Optional valid QuickReads bearer determines canonical account; a supplied invalid/expired Authorization returns 401 and never falls back to guest. Account requests forbid non-null guest_id. Guests require a dedicated reporting UUID, may report Reading/Finished/not_started and saved null/false; saved true is 403. Reject body account IDs, email, names, text, reactions, offsets and unknown fields. Both state keys required; null means unknown/no update; at least one known value required. Per reader/story, each known field is ordered independently by observed_at to millisecond precision, then lexicographically larger lowercase mutation UUID on a timestamp tie. Old reports acknowledge accepted=true, applied=false and cannot overwrite newer known fields. Same reader/mutation UUID and canonical payload recovers original acknowledgement for 90 days; changed payload returns 409. 200 always echoes exact canonical story ID, lowercase mutation UUID and captured reader identity; account_id and guest_id keys are required and the unused value is null. No data merges on login/logout, no favorite/progress/Library writes, and no public history-read operation. Latest inactive state and minimal deduplication receipts retained up to 90 days; owner-only aggregate view is /quickreads/story-activity behind the existing admin guard. Account deletion erases account reports; owner support can erase guest reports by reporting UUID. 30 requests/minute/IP/operation plus API 60/minute/IP, 429 Retry-After. 400/403/404/409/413/415/422 are terminal for unchanged payload; 401 requires the captured account to reauthenticate (never relabel as guest); retry identical mutations with bounded backoff on 429/500/503/network failure. No first-party iOS transport is enabled by publishing this contract.",
